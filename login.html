<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambassador Login | Global Ambassador Programme</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --ink:#1c1a17; --parchment:#f6f1e7; --crimson:#a31621; --crimson-deep:#7a0f17;
    --gold:#c9a449; --navy:#14213d; --line:rgba(28,26,23,0.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--parchment);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
  h1{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);}

  header{position:sticky;top:0;z-index:50;background:rgba(246,241,231,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;max-width:1080px;margin:0 auto;}
  .brand{font-family:'Fraunces',serif;font-weight:700;font-size:1.15rem;letter-spacing:0.02em;color:var(--navy);text-decoration:none;}
  .brand span{color:var(--crimson);}
  .nav a.back{font-size:0.85rem;color:#6b6258;text-decoration:none;}
  .nav a.back:hover{color:var(--ink);}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 28px;}
  .login-card{background:#fff;border:1px solid var(--line);border-radius:2px;padding:52px 48px;width:100%;max-width:440px;box-shadow:0 2px 24px rgba(28,26,23,0.07);}
  .login-card .eyebrow{font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--crimson);font-weight:600;margin-bottom:14px;display:block;}
  .login-card h1{font-size:1.8rem;margin-bottom:8px;line-height:1.1;}
  .login-card p.sub{font-size:0.92rem;color:#6b6258;margin-bottom:36px;line-height:1.6;}

  .field{margin-bottom:20px;}
  .field label{display:block;font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--ink);margin-bottom:8px;}
  .field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:2px;font-family:'Inter',sans-serif;font-size:0.95rem;color:var(--ink);background:var(--parchment);outline:none;transition:border-color .2s;}
  .field input:focus{border-color:var(--navy);}

  .msg{display:none;font-size:0.85rem;padding:12px 14px;border-radius:2px;margin-bottom:20px;line-height:1.5;}
  .msg.error{background:#fdf0f0;border:1px solid rgba(163,22,33,0.25);color:var(--crimson);}
  .msg.info{background:#f0f4ff;border:1px solid rgba(20,33,61,0.2);color:var(--navy);}
  .msg.show{display:block;}

  .btn-login{width:100%;padding:14px;background:var(--crimson);color:#fff;border:none;border-radius:2px;font-family:'Inter',sans-serif;font-size:0.9rem;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;cursor:pointer;transition:background .2s;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-login:hover:not(:disabled){background:var(--crimson-deep);}
  .btn-login:disabled{background:#bbb;cursor:not-allowed;}

  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none;}
  .btn-login.loading .spinner{display:block;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .hint{margin-top:24px;font-size:0.83rem;color:#8a8175;text-align:center;border-top:1px solid var(--line);padding-top:20px;}
  .hint a{color:var(--crimson);text-decoration:none;}
  .hint a:hover{text-decoration:underline;}

  footer{text-align:center;padding:24px;font-size:0.8rem;color:#8a8175;border-top:1px solid var(--line);}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="brand" href="index.html">Global Ambassador <span>Programme</span></a>
    <a class="back" href="index.html">← Back to main site</a>
  </div>
</header>

<main>
  <div class="login-card">
    <span class="eyebrow">Ambassador Portal</span>
    <h1>Welcome back.</h1>
    <p class="sub">Enter the email address you registered with to access the Ambassador Hub.</p>

    <div class="msg error" id="errorMsg"></div>
    <div class="msg info" id="infoMsg"></div>

    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>

    <button class="btn-login" id="loginBtn" onclick="handleLogin()">
      <span class="spinner" id="spinner"></span>
      <span id="btnText">Log in</span>
    </button>

    <div class="hint">
      Don't have access yet? <a href="https://form.typeform.com/to/Mgpstxtp" target="_blank">Apply to become an Ambassador</a>
    </div>
  </div>
</main>

<footer>© 2026 The Global Ambassador Programme</footer>

<script>
  const SHEET_ID = '1UFk5kFXwUearV5-MR5rbcei3chBieT2GNd7wUjw5LfA';

  // Two URL formats to try — gviz tends to handle CORS better
  const URLS = [
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=0`,
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`
  ];

  function setLoading(on) {
    const btn = document.getElementById('loginBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    btn.disabled = on;
    btn.classList.toggle('loading', on);
    spinner.style.display = on ? 'block' : 'none';
    btnText.textContent = on ? 'Checking…' : 'Log in';
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('show');
    document.getElementById('infoMsg').classList.remove('show');
  }

  function showInfo(msg) {
    const el = document.getElementById('infoMsg');
    el.textContent = msg;
    el.classList.add('show');
    document.getElementById('errorMsg').classList.remove('show');
  }

  function clearMessages() {
    document.getElementById('errorMsg').classList.remove('show');
    document.getElementById('infoMsg').classList.remove('show');
  }

  function parseCSV(text) {
    // Remove BOM if present
    text = text.replace(/^\uFEFF/, '');
    const rows = [];
    const lines = text.split(/\r?\n/);
    for (const line of lines) {
      if (!line.trim()) continue;
      const cols = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { inQ = !inQ; }
        else if (c === ',' && !inQ) { cols.push(cur.trim().replace(/^"|"$/g, '')); cur = ''; }
        else { cur += c; }
      }
      cols.push(cur.trim().replace(/^"|"$/g, ''));
      rows.push(cols);
    }
    return rows;
  }

  async function fetchSheet() {
    for (const url of URLS) {
      try {
        const res = await fetch(url, { redirect: 'follow' });
        if (res.ok) {
          const text = await res.text();
          if (text.includes(',') || text.includes('\n')) return text;
        }
      } catch (e) {
        // Try next URL
      }
    }
    return null;
  }

  async function handleLogin() {
    const emailInput = document.getElementById('email').value.trim().toLowerCase();
    clearMessages();

    if (!emailInput) {
      showError('Please enter your email address.');
      return;
    }

    setLoading(true);
    showInfo('Checking your details…');

    const csvText = await fetchSheet();

    if (!csvText) {
      setLoading(false);
      showError(
        'Could not connect to the Ambassador list. ' +
        'Please make sure the spreadsheet is shared as "Anyone with the link can view", then try again. ' +
        'If the problem persists, contact global.ambassadors@crimsoneducation.org.'
      );
      return;
    }

    const rows = parseCSV(csvText);
    if (rows.length < 2) {
      setLoading(false);
      showError('The Ambassador list appears to be empty. Please contact global.ambassadors@crimsoneducation.org.');
      return;
    }

    // Column order: Ambassador Code, Full Name, First Name, Last Name, Email
    const codeCol  = 0;
    const nameCol  = 2; // First Name
    const emailCol = 4;

    // Search for matching email
    const match = rows.slice(1).find(row => {
      const cell = (row[emailCol] || '').trim().toLowerCase();
      return cell === emailInput;
    });

    setLoading(false);
    clearMessages();

    if (match) {
      const name = nameCol !== -1 ? (match[nameCol] || '').trim() : '';
      const code = codeCol !== -1 ? (match[codeCol] || '').trim() : '';
      sessionStorage.setItem('amb_name', name || 'Ambassador');
      sessionStorage.setItem('amb_code', code);
      window.location.href = 'hub.html';
    } else {
      showError(
        "We couldn't find that email address in our Ambassador list. " +
        "Please check your spelling, or contact global.ambassadors@crimsoneducation.org if you believe this is an error."
      );
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
