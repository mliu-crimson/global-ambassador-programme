<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambassador Login | Global Ambassador Programme</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --ink: #1c1a17;
    --parchment: #f6f1e7;
    --crimson: #a31621;
    --crimson-deep: #7a0f17;
    --gold: #c9a449;
    --navy: #14213d;
    --line: rgba(28,26,23,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--parchment);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces', serif; font-weight:600; color:var(--navy);}

  header{
    position:sticky; top:0; z-index:50;
    background:rgba(246,241,231,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; max-width:1080px; margin:0 auto;
  }
  .brand{font-family:'Fraunces', serif; font-weight:700; font-size:1.15rem; letter-spacing:0.02em; color:var(--navy); text-decoration:none;}
  .brand span{color:var(--crimson);}
  .nav a.back{font-size:0.85rem; color:#6b6258; text-decoration:none;}
  .nav a.back:hover{color:var(--ink);}

  main{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:60px 28px;
  }
  .login-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:2px;
    padding:52px 48px;
    width:100%;
    max-width:440px;
    box-shadow: 0 2px 24px rgba(28,26,23,0.07);
  }
  .login-card .eyebrow{
    font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--crimson); font-weight:600; margin-bottom:14px; display:block;
  }
  .login-card h1{font-size:1.8rem; margin-bottom:8px; line-height:1.1;}
  .login-card p.sub{font-size:0.92rem; color:#6b6258; margin-bottom:36px;}

  .field{margin-bottom:20px;}
  .field label{
    display:block; font-size:0.8rem; font-weight:600; text-transform:uppercase;
    letter-spacing:0.07em; color:var(--ink); margin-bottom:8px;
  }
  .field input{
    width:100%; padding:12px 14px;
    border:1px solid var(--line); border-radius:2px;
    font-family:'Inter', sans-serif; font-size:0.95rem; color:var(--ink);
    background:var(--parchment);
    outline:none; transition:border-color .2s;
  }
  .field input:focus{border-color:var(--navy);}

  .error-msg{
    display:none; background:#fdf0f0; border:1px solid rgba(163,22,33,0.25);
    color:var(--crimson); font-size:0.85rem; padding:11px 14px;
    border-radius:2px; margin-bottom:20px;
  }
  .error-msg.show{display:block;}

  .btn-login{
    width:100%; padding:14px;
    background:var(--crimson); color:#fff; border:none; border-radius:2px;
    font-family:'Inter', sans-serif; font-size:0.9rem; font-weight:600;
    letter-spacing:0.05em; text-transform:uppercase;
    cursor:pointer; transition:background .2s;
  }
  .btn-login:hover{background:var(--crimson-deep);}

  .hint{
    margin-top:24px; font-size:0.83rem; color:#8a8175; text-align:center;
    border-top:1px solid var(--line); padding-top:20px;
  }
  .hint a{color:var(--crimson); text-decoration:none;}
  .hint a:hover{text-decoration:underline;}

  footer{
    text-align:center; padding:24px; font-size:0.8rem; color:#8a8175;
    border-top:1px solid var(--line);
  }
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="brand" href="index.html">Global Ambassador <span>Programme</span></a>
    <a class="back" href="index.html">← Back to main site</a>
  </div>
</header>

<main>
  <div class="login-card">
    <span class="eyebrow">Ambassador Portal</span>
    <h1>Welcome back.</h1>
    <p class="sub">Log in to access the Ambassador Hub.</p>

    <div class="error-msg" id="errorMsg">Incorrect email or password. Please try again.</div>

    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn-login" onclick="handleLogin()">Log in</button>

    <div class="hint">
      Don't have access yet? <a href="https://form.typeform.com/to/Mgpstxtp" target="_blank">Apply to become an ambassador</a>
    </div>
  </div>
</main>

<footer>© 2026 The Global Ambassador Programme</footer>

<script>
  // Simple credential check — replace USERNAME/PASSWORD as needed
  const VALID_EMAIL = "ambassador@globinnovation.org";
  const VALID_PASSWORD = "ambassador2026";

  function handleLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const err = document.getElementById('errorMsg');

    if (email === VALID_EMAIL && password === VALID_PASSWORD) {
      err.classList.remove('show');
      window.location.href = 'hub.html';
    } else {
      err.classList.add('show');
    }
  }

  // Allow Enter key to submit
  document.addEventListener('keydown', function(e){
    if(e.key === 'Enter') handleLogin();
  });
</script>
</body>
</html>
